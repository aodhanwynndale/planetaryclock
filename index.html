<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTRO CLOCK WIDGET</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #070914;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: #ffffff;
      overflow: hidden;
      padding: 10px;
      text-transform: uppercase; /* Capslock khusus untuk tampilan widget */
      text-align: center;
    }

    /* 1. TANGGAL */
    .date-display {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #ffffff;
      letter-spacing: 1px;
    }

    /* 2. JAM DIGITAL */
    .time-display {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #ffffff;
      letter-spacing: 1px;
    }

    /* 3. CONTAINER PLANET */
    .clock-container {
      position: relative;
      width: 220px;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 600px;
    }

    .sun {
      position: absolute;
      width: 26px;
      height: 26px;
      background: radial-gradient(circle, #fff7ed 10%, #f59e0b 80%, #d97706 100%);
      border-radius: 50%;
      box-shadow: 0 0 12px #f59e0b, 0 0 20px rgba(245, 158, 11, 0.5);
      z-index: 10;
    }

    .orbit-system {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotateX(65deg) rotateY(-10deg);
      transform-style: preserve-3d;
    }

    .orbit {
      position: absolute;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      animation: spin linear infinite;
      transform-style: preserve-3d;
    }

    .orbit.mercury { width: 65px; height: 65px; animation-duration: 12s; }
    .orbit.venus   { width: 110px; height: 110px; animation-duration: 22s; }
    .orbit.earth   { width: 155px; height: 155px; animation-duration: 36s; }

    .planet-wrapper {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
    }

    .planet {
      border-radius: 50%;
      transform: rotateX(-65deg);
    }

    .mercury .planet { width: 6px; height: 6px; background: #ffffff; box-shadow: 0 0 4px #ffffff; }
    .venus .planet   { width: 9px; height: 9px; background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }
    .earth .planet   { width: 11px; height: 11px; background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }

    /* 4. SKY EVENT */
    .event-display {
      margin-top: 12px;
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      background: transparent;
      border: none;
      padding: 0;
      line-height: 1.4;
      letter-spacing: 1px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 1. TANGGAL -->
  <div class="date-display" id="date">-- --------- ----</div>

  <!-- 2. JAM -->
  <div class="time-display" id="clock">00:00:00 GMT+7</div>

  <!-- 3. PLANET -->
  <div class="clock-container">
    <div class="sun"></div>
    <div class="orbit-system">
      <div class="orbit mercury"><div class="planet-wrapper"><div class="planet"></div></div></div>
      <div class="orbit venus"><div class="planet-wrapper"><div class="planet"></div></div></div>
      <div class="orbit earth"><div class="planet-wrapper"><div class="planet"></div></div></div>
    </div>
  </div>

  <!-- 4. SKY EVENT -->
  <div class="event-display" id="sky-event">
    CALCULATING...
  </div>

  <script>
    const monthNames = [
      "JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI",
      "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"
    ];

    function updateDateTime() {
      const now = new Date();

      // 1. FORMAT TANGGAL
      const day = now.getDate();
      const month = monthNames[now.getMonth()];
      const year = now.getFullYear();
      document.getElementById('date').textContent = `${day} ${month} ${year}`;

      // 2. FORMAT JAM GMT+7
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} GMT+7`;
    }

    function updateSkyEvent() {
      const now = new Date();
      
      // TARGET EVENT TERDEKAT (21 OKTOBER)
      let eventDate = new Date(now.getFullYear(), 9, 21);
      
      if (now > eventDate) {
        eventDate = new Date(now.getFullYear(), 10, 17); 
      }

      const diffTime = eventDate - now;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays <= 0) {
        document.getElementById('sky-event').innerHTML = "TODAY WILL BE<br>ORIONIDS METEOR SHOWER";
      } else {
        document.getElementById('sky-event').innerHTML = `IN ${diffDays} DAYS WILL BE<br>ORIONIDS METEOR SHOWER`;
      }
    }

    setInterval(updateDateTime, 1000);
    updateDateTime();
    updateSkyEvent();
  </script>
</body>
</html>
