<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astro Clock Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #070914; /* Latar belakang kustom */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      overflow: hidden;
      padding: 10px;
    }

    /* 1. Tanggal */
    .date-display {
      font-size: 14px;
      font-weight: 500;
      color: #cbd5e1;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    /* 2. Jam Digital */
    .time-display {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1px;
      font-family: monospace;
      margin-bottom: 10px;
    }

    /* 3. Container Planet */
    .clock-container {
      position: relative;
      width: 220px;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 600px;
    }

    .sun {
      position: absolute;
      width: 26px;
      height: 26px;
      background: radial-gradient(circle, #fff7ed 10%, #f59e0b 80%, #d97706 100%);
      border-radius: 50%;
      box-shadow: 0 0 12px #f59e0b, 0 0 20px rgba(245, 158, 11, 0.5);
      z-index: 10;
    }

    .orbit-system {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotateX(65deg) rotateY(-10deg);
      transform-style: preserve-3d;
    }

    .orbit {
      position: absolute;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      animation: spin linear infinite;
      transform-style: preserve-3d;
    }

    .orbit.mercury { width: 65px; height: 65px; animation-duration: 12s; }
    .orbit.venus   { width: 110px; height: 110px; animation-duration: 22s; }
    .orbit.earth   { width: 155px; height: 155px; animation-duration: 36s; }

    .planet-wrapper {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
    }

    .planet {
      border-radius: 50%;
      transform: rotateX(-65deg);
    }

    .mercury .planet { width: 6px; height: 6px; background: #cbd5e1; box-shadow: 0 0 4px #cbd5e1; }
    .venus .planet   { width: 9px; height: 9px; background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }
    .earth .planet   { width: 11px; height: 11px; background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }

    /* 4. Event Langit / Sky Event */
    .event-display {
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      letter-spacing: 0.5px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 1. Tanggal -->
  <div class="date-display" id="date">-- --------- ----</div>

  <!-- 2. Jam -->
  <div class="time-display" id="clock">00:00:00 GMT+7</div>

  <!-- 3. Planet -->
  <div class="clock-container">
    <div class="sun"></div>
    <div class="orbit-system">
      <div class="orbit mercury"><div class="planet-wrapper"><div class="planet"></div></div></div>
      <div class="orbit venus"><div class="planet-wrapper"><div class="planet"></div></div></div>
      <div class="orbit earth"><div class="planet-wrapper"><div class="planet"></div></div></div>
    </div>
  </div>

  <!-- 4. Sky Event -->
  <div class="event-display">
    ✨ Next: Orionid Meteor Shower (Peak Oct 21)
  </div>

  <script>
    function updateDateTime() {
      const now = new Date();
      
      // Format Tanggal Bahasa Indonesia
      const options = { day: 'numeric', month: 'Long', year: 'numeric' };
      const dateString = now.toLocaleDateString('id-ID', options);
      document.getElementById('date').textContent = dateString;

      // Format Jam dengan GMT+7
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} GMT+7`;
    }

    setInterval(updateDateTime, 1000);
    updateDateTime();
  </script>
</body>
</html>
