<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astro Clock Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: transparent; /* Background transparan */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
    }

    .clock-container {
      position: relative;
      width: 300px;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 800px; /* Efek perspektif kedalaman 3D */
    }

    /* Matahari di pusat */
    .sun {
      position: absolute;
      width: 32px;
      height: 32px;
      background: radial-gradient(circle, #fff7ed 10%, #f59e0b 80%, #d97706 100%);
      border-radius: 50%;
      box-shadow: 0 0 18px #f59e0b, 0 0 35px rgba(245, 158, 11, 0.5);
      z-index: 10;
    }

    /* Orbit elips dengan kemiringan 3D */
    .orbit-system {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotateX(65deg) rotateY(-10deg); /* Membuat orbit jadi oval/elips miring */
      transform-style: preserve-3d;
    }

    .orbit {
      position: absolute;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      animation: spin linear infinite;
      transform-style: preserve-3d;
    }

    /* Durasi dipelankan agar gerakan rileks */
    .orbit.mercury { width: 100px; height: 100px; animation-duration: 12s; }
    .orbit.venus   { width: 160px; height: 160px; animation-duration: 22s; }
    .orbit.earth   { width: 230px; height: 230px; animation-duration: 36s; }

    /* Planet */
    .planet-wrapper {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
    }

    .planet {
      border-radius: 50%;
      /* Membalikkan rotasi 3D agar planet tetap tampak bulat sempurna */
      transform: rotateX(-65deg);
    }

    .mercury .planet { width: 8px; height: 8px; background: #cbd5e1; box-shadow: 0 0 6px #cbd5e1; }
    .venus .planet   { width: 11px; height: 11px; background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
    .earth .planet   { width: 13px; height: 13px; background: #38bdf8; box-shadow: 0 0 10px #38bdf8; }

    /* Jam Digital */
    .time-display {
      margin-top: 5px;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #94a3b8;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="clock-container">
    <div class="sun"></div>
    <div class="orbit-system">
      <div class="orbit mercury"><div class="planet-wrapper"><div class="planet"></div></div></div>
      <div class="orbit venus"><div class="planet-wrapper"><div class="planet"></div></div></div>
      <div class="orbit earth"><div class="planet-wrapper"><div class="planet"></div></div></div>
    </div>
  </div>

  <div class="time-display" id="clock">00:00:00 WIB</div>

  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} WIB`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
