<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTRO CLOCK WIDGET</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #070914;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: #ffffff;
      overflow: hidden;
      padding: 10px;
      text-transform: uppercase;
      text-align: center;
    }

    /* 1. TANGGAL */
    .date-display {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #ffffff;
      letter-spacing: 1px;
    }

    /* 2. JAM DIGITAL */
    .time-display {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #ffffff;
      letter-spacing: 1px;
    }

    /* 3. JAM ANALOG ASTRO 2D (DIKECILKAN AGAR PADAT) */
    .clock-face {
      position: relative;
      width: 185px; /* Dikecilkan dari 230px */
      height: 185px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ANGKA JAM 1-12 */
    .number {
      position: absolute;
      font-size: 13px;
      font-weight: bold;
      color: #fef08a;
      text-shadow: 0 0 5px rgba(254, 240, 138, 0.5);
      width: 18px;
      height: 18px;
      line-height: 18px;
      text-align: center;
      margin-left: -9px;
      margin-top: -9px;
      z-index: 15;
    }

    /* MATAHARI DI PUSAT */
    .sun {
      position: absolute;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #fef08a 20%, #f59e0b 80%);
      border-radius: 50%;
      box-shadow: 0 0 10px #f59e0b, 0 0 18px rgba(245, 158, 11, 0.6);
      z-index: 10;
    }

    /* LINTASAN ORBIT PLANET PADAT & RAPAT */
    .orbit {
      position: absolute;
      border: 1px dashed rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      animation: spin linear infinite;
    }
    .orbit.mercury { width: 44px; height: 44px; animation-duration: 14s; }
    .orbit.venus   { width: 70px; height: 70px; animation-duration: 24s; }
    .orbit.earth   { width: 96px; height: 96px; animation-duration: 38s; }
    .orbit.mars    { width: 122px; height: 122px; animation-duration: 52s; }

    .planet {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
    }
    .mercury .planet { width: 4px; height: 4px; background: #cbd5e1; box-shadow: 0 0 4px #cbd5e1; }
    .venus .planet   { width: 6px; height: 6px; background: #fbbf24; box-shadow: 0 0 5px #fbbf24; }
    .earth .planet   { width: 8px; height: 8px; background: #38bdf8; box-shadow: 0 0 7px #38bdf8; }
    .mars .planet    { width: 6px; height: 6px; background: #f97316; box-shadow: 0 0 5px #f97316; }

    /* JARUM JAM ANALOG */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
    }

    .hour-hand {
      width: 2.5px;
      height: 38px;
      margin-left: -1.25px;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
      z-index: 12;
    }

    .minute-hand {
      width: 2px;
      height: 54px;
      margin-left: -1px;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
      z-index: 13;
    }

    .second-hand {
      width: 1.5px;
      height: 64px;
      margin-left: -0.75px;
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.9);
      z-index: 14;
    }

    .center-dot {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #ef4444;
      border-radius: 50%;
      z-index: 16;
    }

    /* 4. SKY EVENT */
    .event-display {
      margin-top: 14px;
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      line-height: 1.4;
      letter-spacing: 1px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 1. TANGGAL -->
  <div class="date-display" id="date">-- --------- ----</div>

  <!-- 2. JAM DIGITAL -->
  <div class="time-display" id="clock">00:00:00 GMT+7</div>

  <!-- 3. JAM ANALOG ASTRO 2D -->
  <div class="clock-face">
    <!-- ANGKA 1-12 DINAMIS -->
    <div id="numbers-container"></div>

    <!-- MATAHARI & 4 PLANET 2D -->
    <div class="sun"></div>
    <div class="orbit mercury"><div class="planet"></div></div>
    <div class="orbit venus"><div class="planet"></div></div>
    <div class="orbit earth"><div class="planet"></div></div>
    <div class="orbit mars"><div class="planet"></div></div>

    <!-- JARUM JAM ANALOG -->
    <div class="hand hour-hand" id="hour-hand"></div>
    <div class="hand minute-hand" id="minute-hand"></div>
    <div class="hand second-hand" id="second-hand"></div>
    <div class="center-dot"></div>
  </div>

  <!-- 4. SKY EVENT -->
  <div class="event-display" id="sky-event">
    CALCULATING...
  </div>

  <script>
    const monthNames = [
      "JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI",
      "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"
    ];

    function generateNumbers() {
      const container = document.getElementById('numbers-container');
      const radius = 74; // Jarak lingkaran angka ditarik lebih rapat
      const centerX = 92.5; // Pusat koordinat baru
      const centerY = 92.5;

      for (let i = 1; i <= 12; i++) {
        const angle = (i * 30 - 90) * (Math.PI / 180);
        const x = centerX + radius * Math.cos(angle);
        const y = centerY + radius * Math.sin(angle);

        const numDiv = document.createElement('div');
        numDiv.className = 'number';
        numDiv.style.left = `${x}px`;
        numDiv.style.top = `${y}px`;
        numDiv.textContent = i;
        container.appendChild(numDiv);
      }
    }

    function updateDateTime() {
      const now = new Date();

      // 1. TANGGAL
      const day = now.getDate();
      const month = monthNames[now.getMonth()];
      const year = now.getFullYear();
      document.getElementById('date').textContent = `${day} ${month} ${year}`;

      // 2. JAM DIGITAL GMT+7
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      const strH = String(hours).padStart(2, '0');
      const strM = String(minutes).padStart(2, '0');
      const strS = String(seconds).padStart(2, '0');
      document.getElementById('clock').textContent = `${strH}:${strM}:${strS} GMT+7`;

      // 3. JARUM JAM ANALOG
      const hourDeg = (hours % 12 + minutes / 60) * 30;
      const minuteDeg = (minutes + seconds / 60) * 6;
      const secondDeg = seconds * 6;

      document.getElementById('hour-hand').style.transform = `rotate(${hourDeg}deg)`;
      document.getElementById('minute-hand').style.transform = `rotate(${minuteDeg}deg)`;
      document.getElementById('second-hand').style.transform = `rotate(${secondDeg}deg)`;
    }

    function updateSkyEvent() {
      const now = new Date();
      
      let eventDate = new Date(now.getFullYear(), 9, 21);
      if (now > eventDate) {
        eventDate = new Date(now.getFullYear(), 10, 17); 
      }

      const diffTime = eventDate - now;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays <= 0) {
        document.getElementById('sky-event').innerHTML = "TODAY WILL BE<br>ORIONIDS METEOR SHOWER";
      } else {
        document.getElementById('sky-event').innerHTML = `IN ${diffDays} DAYS WILL BE<br>ORIONIDS METEOR SHOWER`;
      }
    }

    generateNumbers();
    setInterval(updateDateTime, 1000);
    updateDateTime();
    updateSkyEvent();
  </script>
</body>
</html>
