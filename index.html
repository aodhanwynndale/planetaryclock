<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Astro Clock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: transparent; color-scheme: light dark; }
  body {
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    padding: 6px; overflow: hidden;
    background: transparent;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #f4f1ea; text-transform: uppercase; text-align: center;
  }

  /* KARTU KACA — gelap transparan agar terbaca di mode terang & gelap */
  .card {
    --gold: #e8d5a3;
    position: relative; flex: none; width: 264px; transform-origin: center; padding: 18px 16px 16px;
    border-radius: 30px;
    background:
      radial-gradient(120% 70% at 0% 0%, rgba(37,99,235,.30), transparent 60%),
      radial-gradient(120% 70% at 100% 100%, rgba(14,165,233,.20), transparent 60%),
      radial-gradient(90% 50% at 100% 0%, rgba(34,211,238,.12), transparent 60%),
      rgba(5,15,40,.72);
    box-shadow: 0 10px 40px rgba(2,8,28,.40), inset 0 0 30px rgba(255,255,255,.02);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .card::before { /* border aurora */
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(135deg, rgba(96,165,250,.75), rgba(255,255,255,.08) 35%, rgba(255,255,255,.06) 65%, rgba(34,211,238,.50));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }

  /* TANGGAL + BULAN */
  .top { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 2px; }
  .date { font-size: 10px; letter-spacing: 3px; opacity: .65; font-weight: 500; }
  #moon { width: 16px; height: 16px; opacity: .9; }

  /* JAM DIGITAL */
  .time { font-size: 34px; font-weight: 200; letter-spacing: 4px; line-height: 1.15; padding-left: 4px; }
  .time .sec { font-size: 13px; color: var(--gold); letter-spacing: 2px; margin-left: 4px; font-weight: 400; }
  .tz { font-size: 8px; letter-spacing: 3px; opacity: .4; margin-bottom: 12px; }

  /* JAM ANALOG */
  .face {
    position: relative; width: 200px; height: 200px; margin: 0 auto; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    background: radial-gradient(circle, rgba(255,255,255,.05), transparent 70%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), 0 0 24px rgba(56,189,248,.14);
  }
  .tick { position: absolute; inset: 0; }
  .tick i { display: block; margin: 3px auto 0; width: 1px; height: 4px; background: rgba(255,255,255,.28); }
  .tick.h i { width: 1.5px; height: 8px; background: rgba(232,213,163,.85); }
  .n { position: absolute; font-size: 11px; font-weight: 500; color: var(--gold); transform: translate(-50%,-50%); letter-spacing: 0; }

  .star { position: absolute; border-radius: 50%; background: #fff; animation: tw 4s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .85; } }

  .sun { position: absolute; width: 16px; height: 16px; border-radius: 50%; z-index: 5;
    background: radial-gradient(circle, #fff6cf 15%, #f5b942 70%);
    box-shadow: 0 0 8px #f5b942, 0 0 18px rgba(245,185,66,.55), 0 0 34px rgba(245,185,66,.25); }

  .orbit { position: absolute; border-radius: 50%; animation: spin linear infinite;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  .orbit::before { /* trail */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg 240deg, color-mix(in srgb, var(--c) 65%, transparent) 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.6px), #000 calc(100% - 1.4px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 1.6px), #000 calc(100% - 1.4px));
  }
  .planet { position: absolute; top: 0; left: 50%; transform: translate(-50%,-50%); border-radius: 50%;
    background: var(--c); box-shadow: 0 0 6px var(--c); }
  .mercury { width: 52px;  height: 52px;  animation-duration: 14s; --c: #cbd5e1; }
  .venus   { width: 80px;  height: 80px;  animation-duration: 24s; --c: #e9d5a1; }
  .earth   { width: 108px; height: 108px; animation-duration: 38s; --c: #7dd3fc; }
  .mars    { width: 136px; height: 136px; animation-duration: 52s; --c: #fda48a; }
  .mercury .planet { width: 4px; height: 4px; }
  .venus .planet   { width: 6px; height: 6px; }
  .earth .planet   { width: 7px; height: 7px; }
  .mars .planet    { width: 5px; height: 5px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hands { position: absolute; inset: 0; filter: drop-shadow(0 0 3px rgba(255,255,255,.35)); }
  .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: 50% 100%; }
  .hh { width: 4px; height: 42px; margin-left: -2px; background: #f4f1ea; z-index: 7;
        clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .mh { width: 3px; height: 62px; margin-left: -1.5px; background: #f4f1ea; z-index: 8;
        clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .sh { width: 1px; height: 76px; margin-left: -.5px; background: var(--gold); z-index: 9; }
  .dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; z-index: 10;
         background: var(--gold); box-shadow: 0 0 0 2px rgba(5,15,40,.9); }

  /* SKY EVENT */
  .ev { margin-top: 14px; }
  .ev .l { font-size: 8px; letter-spacing: 3px; opacity: .4; }
  .ev .t { font-size: 11px; letter-spacing: 2px; opacity: .85; margin-top: 4px; font-weight: 500; }
  .ev .d { font-size: 11px; letter-spacing: 3px; color: var(--gold); margin-top: 3px; }

  @media (prefers-reduced-motion: reduce) { .orbit, .star { animation: none; } }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <svg id="moon" viewBox="-10 -10 20 20">
      <circle r="8" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.3)" stroke-width=".6"/>
      <g id="moon-g"><path id="moon-lit" fill="#f3e7c4"/></g>
    </svg>
    <div class="date" id="date">-- --------- ----</div>
  </div>
  <div class="time"><span id="hm">00:00</span><span class="sec" id="ss">00</span></div>
  <div class="tz" id="tz">GMT</div>

  <div class="face" id="face">
    <div class="sun"></div>
    <div class="orbit mercury"><div class="planet"></div></div>
    <div class="orbit venus"><div class="planet"></div></div>
    <div class="orbit earth"><div class="planet"></div></div>
    <div class="orbit mars"><div class="planet"></div></div>
    <span class="n" style="left:50%;top:22px">12</span>
    <span class="n" style="left:178px;top:50%">3</span>
    <span class="n" style="left:50%;top:178px">6</span>
    <span class="n" style="left:22px;top:50%">9</span>
    <div class="hands">
      <div class="hand hh" id="hh"></div>
      <div class="hand mh" id="mh"></div>
      <div class="hand sh" id="sh"></div>
    </div>
    <div class="dot"></div>
  </div>

  <div class="ev">
    <div class="l">NEXT SKY EVENT</div>
    <div class="t" id="ev-name">CALCULATING...</div>
    <div class="d" id="ev-days"></div>
  </div>
</div>

<script>
  const MONTHS = ["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];
  const EVENTS = [ // [bulan, tanggal, nama] — perkiraan puncak, berulang tiap tahun
    [1,3,"QUADRANTIDS"],[4,22,"LYRIDS"],[5,6,"ETA AQUARIIDS"],[8,12,"PERSEIDS"],
    [10,21,"ORIONIDS"],[11,17,"LEONIDS"],[12,14,"GEMINIDS"],[12,22,"URSIDS"]
  ];
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");

  // Tick marks
  const face = $("face");
  for (let i = 0; i < 60; i++) {
    const t = document.createElement("div");
    t.className = "tick" + (i % 5 === 0 ? " h" : "");
    t.style.transform = `rotate(${i * 6}deg)`;
    t.innerHTML = "<i></i>";
    face.appendChild(t);
  }
  // Bintang kecil (posisi tetap)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 16; i++) {
    const a = rnd() * Math.PI * 2, r = 22 + rnd() * 62, s = 1 + rnd() * 1.2;
    const el = document.createElement("div");
    el.className = "star";
    el.style.cssText = `width:${s}px;height:${s}px;left:${100 + r * Math.cos(a)}px;top:${100 + r * Math.sin(a)}px;animation-delay:${(rnd() * 4).toFixed(2)}s;animation-duration:${(3 + rnd() * 3).toFixed(1)}s`;
    face.insertBefore(el, face.firstChild);
  }

  // Fase bulan
  function drawMoon() {
    const syn = 29.530588853;
    const days = Date.now() / 86400000 - 10962.76;
    const p = (((days % syn) + syn) % syn) / syn;
    const r = 8, k = Math.cos(2 * Math.PI * p), rx = Math.abs(k) * r;
    const sweep = k > 0 ? 0 : 1;
    $("moon-lit").setAttribute("d", `M0 ${-r} A${r} ${r} 0 0 1 0 ${r} A${rx} ${r} 0 0 ${sweep} 0 ${-r}Z`);
    $("moon-g").setAttribute("transform", p > 0.5 ? "scale(-1,1)" : "");
  }

  // Label zona waktu otomatis
  function tzLabel(d) {
    const o = -d.getTimezoneOffset(), s = o >= 0 ? "+" : "-", a = Math.abs(o);
    return "GMT" + s + Math.floor(a / 60) + (a % 60 ? ":" + pad(a % 60) : "");
  }

  // Sky event berikutnya
  function updateEvent() {
    const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let best = null;
    for (const [m, d, name] of EVENTS) {
      for (const y of [now.getFullYear(), now.getFullYear() + 1]) {
        const dt = new Date(y, m - 1, d);
        if (dt >= today && (!best || dt < best.dt)) best = { dt, name };
      }
    }
    const diff = Math.round((best.dt - today) / 86400000);
    $("ev-name").textContent = best.name + " METEOR SHOWER";
    $("ev-days").textContent = diff === 0 ? "TODAY" : `IN ${diff} DAY${diff > 1 ? "S" : ""}`;
  }

  // Jam (jarum detik halus)
  function tick() {
    const n = new Date(), ms = n.getMilliseconds();
    const s = n.getSeconds() + ms / 1000, m = n.getMinutes() + s / 60, h = (n.getHours() % 12) + m / 60;
    $("hh").style.transform = `rotate(${h * 30}deg)`;
    $("mh").style.transform = `rotate(${m * 6}deg)`;
    $("sh").style.transform = `rotate(${s * 6}deg)`;
    $("hm").textContent = pad(n.getHours()) + ":" + pad(n.getMinutes());
    $("ss").textContent = pad(n.getSeconds());
    requestAnimationFrame(tick);
  }

  function slow() {
    const n = new Date();
    $("date").textContent = `${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;
    $("tz").textContent = tzLabel(n);
    drawMoon(); updateEvent();
  }
  // Skala otomatis agar pas di ukuran embed berapa pun
  const card = document.querySelector(".card");
  function fit() {
    const k = Math.min((innerWidth - 12) / card.offsetWidth, (innerHeight - 12) / card.offsetHeight, 1.5);
    card.style.transform = `scale(${k})`;
  }
  addEventListener("resize", fit); fit();
  // Tambahkan ?solid di URL untuk latar gelap penuh (cadangan jika Notion menampilkan putih)
  if (/solid/.test(location.search)) {
    document.documentElement.style.background = "#050d1f";
    document.body.style.background = "radial-gradient(90% 60% at 20% 0%, #0f2a5c, transparent 70%), radial-gradient(90% 60% at 90% 100%, #0b3a5a, transparent 70%), #050d1f";
  }
  slow(); setInterval(slow, 60000); tick();
</script>
</body>
</html>
